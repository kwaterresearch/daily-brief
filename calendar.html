<!DOCTYPE html>
<!-- calendar-ui: v4.6 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지난 브리핑 | K-water연구원 데일리 브리핑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg:#f6f5f2; --surface:#fff; --ink:#16191d; --ink2:#454b54; --muted:#868d97;
          --line:#e6e3dd; --accent:#0b2a5b; --accent-soft:#e9eef7; --off:#efede8; --today:#c4161c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101317; --surface:#181c22; --ink:#eceff3; --ink2:#c3c9d1; --muted:#8b939e;
            --line:#2a3038; --accent:#a9c2ee; --accent-soft:#1d2738; --off:#1c2027; --today:#ff7b7b; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { font-family:'Pretendard','Malgun Gothic','Noto Sans KR',sans-serif; background:var(--bg);
         margin:0; color:var(--ink); word-break:keep-all; }
  .bar { position:sticky; top:0; background:color-mix(in srgb, var(--surface) 88%, transparent);
         backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .bar-in { max-width:760px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; }
  .brand { color:var(--ink); text-decoration:none; font-size:14px; }
  .brand b { color:var(--accent); font-weight:800; }
  .bar-in .today-link { margin-left:auto; font-size:13px; color:var(--ink2); text-decoration:none;
                        padding:6px 10px; border-radius:999px; }
  .bar-in .today-link:hover { background:var(--accent-soft); color:var(--accent); }
  .page { max-width:760px; margin:0 auto; padding:28px 20px 56px; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:1.6px; color:var(--accent); }
  h1 { font-size:34px; margin:6px 0 6px; letter-spacing:-0.8px; font-weight:800; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; line-height:1.6; }
  .latest { display:inline-block; margin-bottom:22px; padding:9px 16px; border-radius:999px;
            background:var(--accent); color:#fff; font-size:13px; font-weight:700; text-decoration:none; }
  @media (prefers-color-scheme: dark) { .latest { color:#101317; } }
  .wrap { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .controls { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .controls button { background:transparent; color:var(--ink2); border:1px solid var(--line);
                     padding:7px 14px; border-radius:999px; cursor:pointer; font-family:inherit; font-size:13px; }
  .controls button:hover { background:var(--accent-soft); color:var(--accent); }
  .month { text-align:center; }
  #month-label { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
  #month-count { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .head { text-align:center; font-size:12px; color:var(--muted); padding:6px 0; font-weight:600; }
  .head.sun { color:#d23b3b; } .head.sat { color:#3b78d2; }
  .day { aspect-ratio:1; display:flex; align-items:center; justify-content:center;
         border-radius:10px; font-size:14px; background:var(--off); color:var(--muted); text-decoration:none; opacity:0.6; }
  a.day { background:var(--accent-soft); color:var(--accent); font-weight:800; opacity:1;
          border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); transition:transform 0.1s; }
  a.day:hover { background:var(--accent); color:var(--surface); transform:scale(1.05); }
  .day.today { outline:2px solid var(--today); outline-offset:-2px; opacity:1; }
  .day.empty-cell { background:transparent; }
  .legend { display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
            font-size:12px; color:var(--muted); margin-top:16px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px;
              vertical-align:-2px; margin-right:5px; }
  .footer { margin-top:28px; font-size:11px; color:var(--muted); text-align:center; }
  @media (max-width:520px) {
    .page { padding:20px 14px 40px; }
    .wrap { padding:14px 10px; }
    .grid { gap:4px; }
    .day { font-size:13px; border-radius:8px; }
  }
</style>
</head>
<body>
  <header class="bar"><div class="bar-in">
    <a class="brand" href="./">K-water연구원 <b>Daily Brief</b></a>
    <a class="today-link" href="./">오늘 브리핑 ›</a>
  </div></header>
  <div class="page">
    <div class="kicker">ARCHIVE</div>
    <h1>지난 브리핑</h1>
    <div class="sub">발행된 날짜를 누르면 그날의 브리핑을 볼 수 있습니다. 브리핑은 평일에만 발행됩니다.</div>
    <a class="latest" id="latest" href="./" hidden>가장 최근 브리핑 ›</a>
    <div class="wrap">
      <div class="controls">
        <button type="button" onclick="changeMonth(-1)">‹ 이전 달</button>
        <div class="month"><span id="month-label"></span><span id="month-count"></span></div>
        <button type="button" onclick="changeMonth(1)">다음 달 ›</button>
      </div>
      <div class="grid" id="head-row"></div>
      <div class="grid" id="cal"></div>
      <div class="legend">
        <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>발행일</span>
        <span><i style="background:var(--off)"></i>미발행</span>
        <span><i style="outline:2px solid var(--today);outline-offset:-2px"></i>오늘</span>
      </div>
    </div>
    <div class="footer">발행 · K-water연구원 경영연구소 / 개발 · K-water연구원 AI연구소</div>
  </div>
<script>
(function(){
  var publishedDates = new Set();
  var today = new Date();
  var viewY = today.getFullYear(), viewM = today.getMonth();
  var labels = ['일','월','화','수','목','금','토'];

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function ymd(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }

  function renderHead(){
    var h = document.getElementById('head-row');
    h.innerHTML = labels.map(function(l,i){
      var cls = i===0 ? 'head sun' : (i===6 ? 'head sat' : 'head');
      return '<div class="'+cls+'">'+l+'</div>';
    }).join('');
  }

  function render(){
    document.getElementById('month-label').textContent = viewY+'년 '+(viewM+1)+'월';
    var first = new Date(viewY, viewM, 1).getDay();
    var lastDay = new Date(viewY, viewM+1, 0).getDate();
    var html = '', n = 0;
    for (var i=0; i<first; i++) html += '<div class="day empty-cell"></div>';
    for (var d=1; d<=lastDay; d++){
      var key = ymd(viewY, viewM, d);
      var isToday = (viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate());
      var cls = 'day' + (isToday ? ' today' : '');
      if (publishedDates.has(key)){
        n++;
        html += '<a class="'+cls+'" href="archive/'+key+'.html" title="'+key+' 브리핑">'+d+'</a>';
      } else {
        html += '<div class="'+cls+'">'+d+'</div>';
      }
    }
    document.getElementById('cal').innerHTML = html;
    document.getElementById('month-count').textContent = n ? ('발행 '+n+'회') : '';
  }

  window.changeMonth = function(diff){
    viewM += diff;
    if (viewM<0){ viewM=11; viewY--; }
    if (viewM>11){ viewM=0; viewY++; }
    render();
  };

  renderHead();
  fetch('archive/index.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      var dates = data.dates || [];
      publishedDates = new Set(dates);
      if (dates.length){
        var latest = dates.slice().sort().pop();
        var a = document.getElementById('latest');
        a.href = 'archive/'+latest+'.html';
        a.textContent = '가장 최근 브리핑 ('+latest+') ›';
        a.hidden = false;
      }
      render();
    })
    .catch(function(){ render(); });
})();
</script>
</body>
</html>
